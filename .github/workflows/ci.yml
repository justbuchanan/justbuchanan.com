# Every push to master is built and pushed to ghcr.io as :latest and :<sha>.
# Pull requests only build.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - run: nix build .#image
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/master'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker load < result
          docker tag justbuchanan.com:latest "$IMAGE:latest"
          docker tag justbuchanan.com:latest "$IMAGE:${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE"
